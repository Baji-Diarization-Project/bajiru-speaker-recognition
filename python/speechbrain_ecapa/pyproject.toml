[project]
name = "speechbrain_ecapa"
version = "0.1.0"
description = "Speaker recognition helpers built around the SpeechBrain ECAPA model"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.3",
    "silero-vad>=6.2.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "pandas>=3.0.1",
    "speechbrain>=1.1.0"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
speechbrain-create-profile = "speechbrain_ecapa.scripts.create_speaker_profile:main"
speechbrain-analyse-audio = "speechbrain_ecapa.scripts.analyse_audio:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "S110", "BLE001", "PLR2004","D203","D213","COM812", "T201"]

[tool.ruff.lint.pylint]
max-args = 10

[mypy]
mypy_path = "python/speechbrain_ecapa/src"