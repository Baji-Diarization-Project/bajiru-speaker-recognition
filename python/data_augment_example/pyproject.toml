[project]
name = "data-augment-example"
version = "0.1.0"
description = "Smoke-test / example consumer of the data_augment public API."
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "data-augment",
    "numpy>=2.0",
]

[project.scripts]
augment-example = "data_augment_example.main:main"

[tool.uv.sources]
data-augment = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"
