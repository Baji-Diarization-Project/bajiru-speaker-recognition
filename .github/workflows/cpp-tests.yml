name: C++ Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'cpp_impl/src/**'
      - 'cpp_impl/tests/**'
      - 'cpp_impl/CMakeLists.txt'
      - '.github/workflows/cpp-tests.yml'
  pull_request:
    paths:
      - 'cpp_impl/src/**'
      - 'cpp_impl/tests/**'
      - 'cpp_impl/CMakeLists.txt'
      - '.github/workflows/cpp-tests.yml'

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Pure-C++ correctness gate: LINKJIRU_UNIT_TESTS_ONLY skips JUCE, ONNX
      # Runtime, Boost, and the plugin, so no GPU, model, or submodules are
      # needed. Only googletest is fetched.
      - name: Configure CMake (unit tests only)
        working-directory: cpp_impl
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINKJIRU_UNIT_TESTS_ONLY=ON

      - name: Build unit tests
        working-directory: cpp_impl
        run: cmake --build build --target LinkjiruUnitTests

      - name: Run unit tests
        working-directory: cpp_impl/build/tests
        run: ./LinkjiruUnitTests.exe
